#############################
# BloodDonation – Production
# обновление данных: каждые 4 часа
#############################

services:
  # ──────────────────────────
  # REST API + static frontend
  # ──────────────────────────
  api:
    build: .
    env_file: .env
    volumes:
      - ./backend/db:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/donations"]
      interval: 1m
      retries: 3

  # ──────────────────────────
  # ETL-pipeline после обновления Worker
  # ──────────────────────────
  pipeline:
    environment:
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
    build: .
    env_file: .env
    volumes:
      - ./backend/db:/data
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          SECS=$$(python -c "from datetime import datetime, timedelta, timezone; now=datetime.now(timezone.utc); target=now.replace(minute=20, second=0, microsecond=0); target += timedelta(hours=1) if target <= now else timedelta(0); target += timedelta(hours=((4 - target.hour % 4) % 4)); print(int((target-now).total_seconds()))")
          echo "[Pipeline] next run in $$SECS s until next 4-hour slot (:20 UTC)"
          sleep $$SECS
          echo "[Pipeline] --- $$(date -u) --- start"
          python -m backend.data_pipeline.run_pipeline
          echo "[Pipeline] --- $$(date -u) --- finish"
          sleep 60
        done
    restart: unless-stopped

  # ──────────────────────────
  # HTTPS-прокси + статик
  # ──────────────────────────
  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/usr/share/caddy
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

# ──────────────
# Persisted data
# ──────────────
volumes:
  caddy_data:
  caddy_config:
