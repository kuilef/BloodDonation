services:
  router:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - SERVICE_FQDN_ROUTER_80=/
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/usr/share/caddy:ro
    expose:
      - "80"

  api:
    build: .
    restart: unless-stopped
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    volumes:
      - ${BLOODDONATION_DB_PATH:-/root/coolify-stacks/blooddonation/db}:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/donations', timeout=5).read()"
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 20s
    expose:
      - "8000"

  pipeline:
    build: .
    restart: unless-stopped
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - ${BLOODDONATION_DB_PATH:-/root/coolify-stacks/blooddonation/db}:/data
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          SECS=$$(python -c "from datetime import datetime, timedelta, timezone; now=datetime.now(timezone.utc); t=now.replace(hour=3, minute=20, second=0, microsecond=0); target=(t+timedelta(days=1)) if t<=now else t; print(int((target-now).total_seconds()))")
          echo "[Pipeline] next run in $$SECS s until 03:20 UTC"
          sleep $$SECS
          echo "[Pipeline] --- $$(date -u) --- start"
          python -m backend.data_pipeline.run_pipeline
          echo "[Pipeline] --- $$(date -u) --- finish"
          sleep 60
        done
